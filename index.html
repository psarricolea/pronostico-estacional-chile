<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronóstico estacional · Chile · Tmax y Tmin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1A26;--line:#2B3B4C;--txt:#EEF2F5;--mute:#93A4B4;--soft:#C9D3DC;--warm:#F29F7D;--cool:#8CC1DC}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Archivo',system-ui,sans-serif;background:var(--ink);color:var(--txt)}
.app{display:flex;height:100%}
aside{width:380px;flex:0 0 380px;padding:28px 28px 20px;display:flex;flex-direction:column;gap:22px;overflow-y:auto;border-right:1px solid var(--line)}
.pista{margin:-12px 0 0;font-size:13px;line-height:1.4;color:var(--mute)}
#map{flex:1;min-width:0;background:#dfe6ec}
.kick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--mute)}
h1{margin:0;font-size:44px;line-height:.92;font-weight:800;font-stretch:72%}
.sub{margin:0;font-size:15px;line-height:1.4;color:var(--soft)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{padding:0;margin-bottom:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;color:var(--soft);background:transparent;border:1px solid var(--line);padding:9px 12px;min-height:40px;cursor:pointer;border-radius:2px}
.seg button:hover{border-color:var(--mute);color:var(--txt)}
.seg button[aria-pressed="true"]{background:var(--txt);color:var(--ink);border-color:var(--txt);font-weight:600}
.leg{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:16px}.bar span{flex:1}
.ticks{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--soft)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:13px;color:var(--soft)}
.cats div{display:flex;align-items:center;gap:8px}.cats i{width:14px;height:14px;display:inline-block;flex:0 0 14px;border:1px solid #3a4a5a}
input[type=range]{width:100%;accent-color:var(--warm)}
.aviso{background:var(--warm);color:var(--ink);padding:14px 16px;font-size:14px;line-height:1.4}
.aviso b{font-weight:800}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.credit{font-size:16px;font-weight:600;font-stretch:85%;color:var(--txt)}
.leaflet-popup-content-wrapper{border-radius:2px;font-family:'Archivo',sans-serif}
.pp h3{margin:0 0 6px;font-size:16px}.pp .big{font-size:26px;font-weight:800;font-stretch:80%}
.pp .row{display:flex;justify-content:space-between;gap:16px;font-family:'JetBrains Mono',monospace;font-size:12px}
.pp .dim{color:#5b6b7b;font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:6px}
.city{font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;color:#0E1A26;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.pais span{display:block;transform:translate(-50%,-50%);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.35em;color:#5d6b79;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.pais.mar span{font-family:'Archivo',sans-serif;font-style:italic;font-size:12px;letter-spacing:.2em;color:#4f6378;text-shadow:none}
.ctl-buscar{background:#fff;border-radius:2px;box-shadow:0 1px 5px rgba(0,0,0,.3);width:280px;font-family:'Archivo',sans-serif}
.ctl-buscar input{width:100%;border:0;padding:9px 11px;font:inherit;font-size:14px;color:#0E1A26;background:transparent;outline:none}
.ctl-buscar ul{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
.ctl-buscar ul:not(:empty){border-top:1px solid #e3e7eb}
.ctl-buscar li{padding:7px 11px;font-size:13px;line-height:1.35;color:#0E1A26;cursor:pointer}
.ctl-buscar li:hover{background:#eef2f5}
.ctl-buscar li.msg{color:#5d6b79;cursor:default}
.ctl-buscar li.msg:hover{background:none}
.ctl-medir a{display:flex!important;align-items:center;justify-content:center;color:#0E1A26}
.ctl-medir.activo a{background:#0E1A26;color:#fff}
.leaflet-container.midiendo{cursor:crosshair}
.medida{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;background:#0E1A26;color:#fff;border:0;border-radius:2px;padding:3px 7px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.medida:before{display:none}
@media (max-width:700px){.ctl-buscar{width:200px}}
.asa{display:none}
@media (max-width:760px){
  html,body{overflow:hidden}
  .app{display:block;position:relative;height:100%;overflow:hidden}
  #map{position:absolute;inset:0}
  aside{position:absolute;left:0;right:0;bottom:0;z-index:1100;width:auto;max-height:80%;padding:0 18px 18px;gap:18px;background:var(--ink);border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35);transform:translateY(calc(100% - var(--asa, 66px)));transition:transform .28s ease;overflow-y:hidden}
  aside.abierto{transform:none;overflow-y:auto}
  .asa{display:flex;flex-direction:column;align-items:stretch;gap:7px;position:sticky;top:0;z-index:2;flex:0 0 auto;margin:0 -18px;padding:9px 18px 12px;min-height:66px;background:var(--ink);border:0;color:var(--txt);font:inherit;text-align:left;cursor:pointer}
  .asa-tira{align-self:center;width:42px;height:4px;border-radius:2px;background:var(--line)}
  .asa-fila{display:flex;justify-content:space-between;align-items:center;gap:12px}
  #asaTxt{font-size:15px;font-weight:600;line-height:1.25}
  #asaTxt small{display:block;white-space:nowrap;font-weight:400;font-size:12px;color:var(--mute)}
  .asa-ico{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
  aside.abierto .asa-ico{transform:none}
  h1,aside > .kick:first-of-type{display:none}
  .leaflet-bottom{bottom:var(--asa, 66px)}
  .leaflet-control-attribution{font-size:9px;line-height:1.3}
  .pais{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <button class="asa" id="asa" type="button" aria-expanded="false"><span class="asa-tira"></span><span class="asa-fila"><span id="asaTxt"></span><span class="asa-ico" id="asaIco">CONTROLES ▲</span></span></button>
  <div class="kick">PRONÓSTICO ESTACIONAL · CHILE</div>
  <h1 id="titulo">Temperatura máxima</h1>
  <p class="sub" id="sub"></p>
  <fieldset><legend>VARIABLE</legend><div class="seg" id="segVar"></div></fieldset>
  <fieldset><legend>PERÍODO</legend><div class="seg" id="segPer"></div></fieldset>
  <fieldset><legend>PRODUCTO</legend><div class="seg" id="segProd"></div></fieldset>
  <div class="leg" id="leyenda"></div>
  <p class="pista">Haz clic en el mapa para ver la probabilidad de cada tercil en ese punto.</p>
  <fieldset><legend><label for="opac">OPACIDAD</label></legend><input id="opac" type="range" min="0.2" max="1" step="0.05" value="0.85"></fieldset>
  <div class="aviso"><b>Se actualiza mes a mes.</b><span id="proxima"></span> Para avisos, alertas y el pronóstico oficial, sigue los canales de la <b>Dirección Meteorológica de Chile (DMC)</b>.</div>
  <div class="meta"><div class="credit" id="credit"></div><div id="metaTxt"></div></div>
</aside>
<div id="map" role="region" aria-label="Mapa de Chile con el pronóstico estacional"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="regiones.js"></script>
<script src="data.js"></script>
<script>
const D = window.DATA;
// Configuración por variable (unidad, paleta, textos). data.js antiguos no la traen: se usa la de temperatura.
const CFG0 = { unidad: '°C', dec: 1, brk: D.brk_anom || [-3, 3], pal: D.pal_anom, pal_cat: D.pal_cat,
  neg: 'más frío', pos: 'más cálido', leyenda: 'ANOMALÍA RESPECTO DE LO NORMAL (°C)',
  sub: 'cuánto más cálido o más frío que lo normal promedian los modelos.' };
const cfg = () => (D.vcfg && D.vcfg[st.v]) || CFG0;
const st = { v: Object.keys(D.vars)[0], p: Object.keys(D.periodos)[0], prod: 'anom', op: 0.85 };
// Vista compartible por enlace: ?v=tmin&p=DEF&prod=cat
try {
  const q = new URLSearchParams(location.search);
  const qv = (q.get('v') || '').toLowerCase(), qp = (q.get('p') || '').toUpperCase(), qr = (q.get('prod') || '').toLowerCase();
  if (D.vars[qv]) st.v = qv;
  if (D.periodos[qp]) st.p = qp;
  if (qr === 'anom' || qr === 'cat') st.prod = qr;
} catch (e) {}
// Próxima actualización: C3S publica el día 10 y la rutina de GitHub corre el día 11 de cada mes
(function () {
  const M = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const i = M.indexOf(String(D.init || '').split(' ')[0].toLowerCase()), el = document.getElementById('proxima');
  if (i >= 0 && el) el.textContent = ' Próxima actualización: 11 de ' + M[(i + 1) % 12] + '.';
})();
const fmt = (x, d=1) => (x>0?'+':'') + x.toFixed(d).replace('.', ',').replace('-', '−');
const fmtU = x => fmt(x, cfg().dec) + (cfg().unidad === '%' ? ' %' : ' ' + cfg().unidad);
const map = L.map('map', { zoomControl: true, minZoom: 3, zoomSnap: 0.25 });
map.fitBounds([[-55.5, -76], [-17.5, -66.5]], { paddingTopLeft: [0, 10], paddingBottomRight: [0, 10] });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Pronóstico: Copernicus C3S · Mapa base y relieve © Esri, HERE, Garmin, USGS, NASA, © OpenStreetMap', maxZoom: 10 }).addTo(map);
// Relieve sombreado fundido (multiply) sobre el mapa base
map.createPane('relieve'); map.getPane('relieve').style.zIndex = 250; map.getPane('relieve').style.mixBlendMode = 'multiply';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { pane: 'relieve', maxZoom: 10, opacity: 0.9 }).addTo(map);
// El pronóstico también se multiplica: el relieve se ve a través de los colores
map.getPane('overlayPane').style.mixBlendMode = 'multiply';
// Mar en azul apagado: fondo oceánico desaturado
map.getPane('tilePane').style.filter = 'saturate(0.35) brightness(1.12) contrast(0.9)';
map.createPane('top'); map.getPane('top').style.zIndex = 450;
let overlay = null;
if (window.REGIONES) L.geoJSON(window.REGIONES, { pane: 'top', interactive: false,
  style: { color: '#24323f', weight: 0.8, fill: false } }).addTo(map);
const etiquetas = [];
D.ciudades.forEach(c => {
  L.circleMarker([c.lat, c.lon], { pane: 'top', radius: 3, color: '#0E1A26', weight: 1.2, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(map);
  etiquetas.push([c, L.marker([c.lat, c.lon], { pane: 'top', interactive: false, icon: L.divIcon({ className: 'city', html: c.n, iconSize: null, iconAnchor: [-6, 8] }) })]);
});
function etiquetasZoom() {
  const z = map.getZoom();
  etiquetas.forEach(([c, m]) => { (c.top === 1 || z >= 6) ? m.addTo(map) : map.removeLayer(m); });
}
map.on('zoomend', etiquetasZoom); etiquetasZoom();
// Nombres de países y océanos (etiquetas propias)
[['ARGENTINA', -37, -65.5], ['BOLIVIA', -19.5, -65], ['PERÚ', -15.8, -72.5], ['PARAGUAY', -23.3, -58.3], ['URUGUAY', -32.8, -56], ['BRASIL', -19, -52],
 ['Océano Pacífico', -36, -82, 'mar'], ['Océano Atlántico', -44, -56, 'mar']].forEach(([n, la, lo, t]) => 
  L.marker([la, lo], { pane: 'top', interactive: false, keyboard: false, icon: L.divIcon({ className: 'pais' + (t ? ' ' + t : ''), html: '<span>' + n + '</span>', iconSize: null }) }).addTo(map));
function capa() { return D.capas[st.v + '_' + st.p]; }
function botones(id, opts, key) {
  const el = document.getElementById(id); el.innerHTML = '';
  Object.entries(opts).forEach(([k, lab]) => {
    if (key === 'p' && !D.capas[st.v + '_' + k]) return;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = lab;
    b.setAttribute('aria-pressed', st[key] === k ? 'true' : 'false');
    b.addEventListener('click', () => { st[key] = k; render(); });
    el.appendChild(b);
  });
}
function leyenda() {
  const el = document.getElementById('leyenda'), k = cfg();
  const lim = x => (x > 0 ? '+' : '') + String(x).replace('-', '−') + (k.unidad === '%' ? ' %' : '');
  const nota = k.nota_seco ? '<p class="pista" style="margin:4px 0 0">' + k.nota_seco + '</p>' : '';
  if (st.prod === 'anom') {
    el.innerHTML = '<div class="kick">' + k.leyenda + '</div><div class="bar">' +
      k.pal.map(c => '<span style="background:' + c + '"></span>').join('') +
      '</div><div class="ticks"><span>' + lim(k.brk[0]) + ' · ' + k.neg + '</span><span>0</span><span>' + k.pos + ' · ' + lim(k.brk[k.brk.length - 1]) + '</span></div>' + nota;
  } else {
    el.innerHTML = '<div class="kick">TERCIL MÁS PROBABLE</div><div class="cats">' +
      D.clases.map((t, i) => '<div><i style="background:' + k.pal_cat[i] + '"></i>' + t + '</div>').join('') + '</div>' + nota;
  }
}
function render() {
  const c = capa(); if (!c) { st.p = Object.keys(D.periodos).find(k => D.capas[st.v + '_' + k]); return render(); }
  botones('segVar', D.vars, 'v'); botones('segPer', D.periodos, 'p');
  botones('segProd', { anom: 'Anomalía', cat: 'Tercil más probable' }, 'prod');
  document.getElementById('titulo').textContent = D.vars[st.v];
  document.getElementById('asaTxt').innerHTML = D.vars[st.v] + ' · ' + D.periodos[st.p] + '<small>' + (st.prod === 'anom' ? 'Anomalía' : 'Tercil más probable') + '</small>';
  document.getElementById('sub').textContent = D.periodos[st.p] + ' · ' + (st.prod === 'anom'
    ? cfg().sub
    : 'categoría (bajo, normal o sobre lo normal) con mayor probabilidad.');
  const url = st.prod === 'anom' ? c.img_anom : c.img_cat;
  if (overlay) map.removeLayer(overlay);
  overlay = L.imageOverlay(url, c.bounds, { opacity: st.op, alt: D.vars[st.v] + ' ' + D.periodos[st.p] }).addTo(map);
  leyenda(); map.closePopup();
  try { history.replaceState(null, '', '?v=' + st.v + '&p=' + st.p + '&prod=' + st.prod); } catch (e) {}
}
// Interpolación bilineal sobre la grilla de 1°
function consulta(lat, lon, arr) {
  const g = D.grid, fx = (lon - g.xmin) / g.dx - 0.5, fy = (g.ymax - lat) / g.dy - 0.5;
  const i0 = Math.floor(fx), j0 = Math.floor(fy); let s = 0, w = 0;
  [[0,0],[1,0],[0,1],[1,1]].forEach(([a, b]) => {
    const i = Math.min(Math.max(i0 + a, 0), g.nx - 1), j = Math.min(Math.max(j0 + b, 0), g.ny - 1);
    const v = arr[j * g.nx + i]; if (v === null || v === undefined) return;
    const wt = (a ? fx - i0 : 1 - (fx - i0)) * (b ? fy - j0 : 1 - (fy - j0)); s += wt * v; w += wt;
  });
  return w > 0 ? s / w : null;
}
// ---- Panel inferior plegable en celular ----
const esMovil = () => matchMedia('(max-width:760px)').matches;
const panel = document.querySelector('aside'), asa = document.getElementById('asa');
function abrirPanel(on) {
  panel.classList.toggle('abierto', on);
  asa.setAttribute('aria-expanded', on);
  document.getElementById('asaIco').textContent = on ? 'CERRAR ▼' : 'CONTROLES ▲';
  if (!on) panel.scrollTop = 0;
}
asa.addEventListener('click', () => abrirPanel(!panel.classList.contains('abierto')));
// Altura real de la barra plegada (para que no asomen los controles)
const medirAsa = () => document.documentElement.style.setProperty('--asa', asa.offsetHeight + 'px');
medirAsa(); addEventListener('resize', medirAsa);
if (window.ResizeObserver) new ResizeObserver(medirAsa).observe(asa);
if (document.fonts) document.fonts.ready.then(medirAsa);
document.querySelectorAll('.seg').forEach(el => el.addEventListener('click', () => setTimeout(medirAsa, 0)));
map.on('click dragstart', () => { if (esMovil() && panel.classList.contains('abierto')) abrirPanel(false); });
// Que los popups no queden tapados por el panel
if (esMovil()) L.Popup.prototype.options.autoPanPaddingBottomRight = L.point(10, 90);

// ---- Medición de distancias ----
let midiendo = false, ptsMed = [];
const capaMed = L.layerGroup().addTo(map);
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toLocaleString('es-CL', { maximumFractionDigits: m < 10000 ? 2 : m < 100000 ? 1 : 0 }) + ' km';
function dibujarMed() {
  capaMed.clearLayers();
  if (!ptsMed.length) return;
  L.polyline(ptsMed, { pane: 'top', color: '#0E1A26', weight: 2.5, dashArray: '6 5', interactive: false }).addTo(capaMed);
  let tot = 0;
  ptsMed.forEach((p, i) => {
    if (i) tot += map.distance(ptsMed[i - 1], p);
    L.circleMarker(p, { pane: 'top', radius: 4, color: '#0E1A26', weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(capaMed);
  });
  if (ptsMed.length > 1) L.tooltip({ permanent: true, direction: 'right', offset: [8, 0], className: 'medida' })
    .setLatLng(ptsMed[ptsMed.length - 1]).setContent(fmtDist(tot)).addTo(capaMed);
}
const Medir = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar ctl-medir'), a = L.DomUtil.create('a', '', div);
    a.href = '#'; a.setAttribute('role', 'button');
    a.title = 'Medir distancia: clic para agregar puntos, doble clic para terminar, Esc para borrar';
    a.setAttribute('aria-label', 'Medir distancia');
    a.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); midiendo ? limpiarMed() : iniciarMed(); });
    this._div = div;
    return div;
  }
});
const ctlMedir = new Medir().addTo(map);
function modoMed(on) {
  midiendo = on;
  ctlMedir._div.classList.toggle('activo', on);
  map.getContainer().classList.toggle('midiendo', on);
  on ? map.doubleClickZoom.disable() : map.doubleClickZoom.enable();
}
function iniciarMed() { ptsMed = []; dibujarMed(); map.closePopup(); modoMed(true); }
function limpiarMed() { ptsMed = []; dibujarMed(); modoMed(false); }
map.on('click', e => {
  if (!midiendo) return;
  const u = ptsMed[ptsMed.length - 1];
  if (u && map.latLngToContainerPoint(u).distanceTo(e.containerPoint) < 4) return;
  ptsMed.push(e.latlng); dibujarMed();
});
map.on('dblclick', () => { if (midiendo) setTimeout(() => modoMed(false), 0); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (midiendo || ptsMed.length)) limpiarMed(); });

// ---- Búsqueda de direcciones (Nominatim / OpenStreetMap) ----
let marcaBusq = null;
function irA(lat, lon) {
  if (midiendo) limpiarMed();
  if (marcaBusq) map.removeLayer(marcaBusq);
  marcaBusq = L.circleMarker([lat, lon], { pane: 'top', radius: 7, color: '#fff', weight: 3, fillColor: '#E4572E', fillOpacity: 1, interactive: false }).addTo(map);
  map.flyTo([lat, lon], Math.max(map.getZoom(), 8), { duration: 0.8 });
  map.once('moveend', () => map.fire('click', { latlng: L.latLng(lat, lon) }));
}
const Buscar = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const div = L.DomUtil.create('div', 'ctl-buscar');
    div.innerHTML = '<input type="search" placeholder="Buscar dirección o comuna…" aria-label="Buscar dirección o comuna" autocomplete="off"><ul role="listbox"></ul>';
    L.DomEvent.disableClickPropagation(div); L.DomEvent.disableScrollPropagation(div);
    const inp = div.querySelector('input'), ul = div.querySelector('ul'), esc = t => t.replace(/[<>&"]/g, '');
    let res = [];
    inp.addEventListener('keydown', async ev => {
      if (ev.key === 'Escape') { ul.innerHTML = ''; return; }
      if (ev.key !== 'Enter') return;
      const q = inp.value.trim();
      if (q.length < 3) return;
      ul.innerHTML = '<li class="msg">Buscando…</li>';
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=cl&accept-language=es&q=' + encodeURIComponent(q));
        res = await r.json();
        ul.innerHTML = res.length
          ? res.map((x, i) => '<li role="option" data-i="' + i + '">' + esc(x.display_name.replace(/, Chile$/, '')) + '</li>').join('')
          : '<li class="msg">Sin resultados en Chile.</li>';
      } catch (e) { ul.innerHTML = '<li class="msg">No se pudo buscar ahora. Intenta de nuevo.</li>'; }
    });
    inp.addEventListener('input', () => { if (!inp.value) ul.innerHTML = ''; });
    ul.addEventListener('click', ev => {
      const li = ev.target.closest('li[data-i]');
      if (!li) return;
      const x = res[+li.dataset.i];
      ul.innerHTML = ''; inp.value = x.display_name.split(',')[0];
      irA(+x.lat, +x.lon);
    });
    return div;
  }
});
new Buscar().addTo(map);
map.attributionControl.addAttribution('Búsqueda: Nominatim/OSM');

// ¿El punto está dentro de Chile? (polígonos de regiones)
function enAnillo(x, y, r) {
  let d = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) d = !d;
  }
  return d;
}
function enChile(lat, lng) {
  const R = window.REGIONES;
  if (!R) return true;
  const feats = R.features || (R.type === 'Feature' ? [R] : [{ geometry: R }]);
  return feats.some(f => {
    const g = f.geometry; if (!g) return false;
    const P = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    return P.some(p => enAnillo(lng, lat, p[0]) && !p.slice(1).some(h => enAnillo(lng, lat, h)));
  });
}
map.on('click', e => {
  if (midiendo) return;
  const c = capa(), { lat, lng } = e.latlng;
  if (lng < D.grid.xmin || lng > D.grid.xmin + D.grid.nx * D.grid.dx || lat > D.grid.ymax || lat < D.grid.ymax - D.grid.ny * D.grid.dy) return;
  if (!enChile(lat, lng)) return;
  const an = consulta(lat, lng, c.anom), pb = consulta(lat, lng, c.pb), pn = consulta(lat, lng, c.pn), pa = consulta(lat, lng, c.pa);
  if (an === null) {
    if (cfg().nota_seco) L.popup({ maxWidth: 240 }).setLatLng(e.latlng).setContent(
      '<div class="pp"><h3>' + D.vars[st.v] + ' · ' + D.periodos[st.p] + '</h3>Zona seca en este período: la lluvia normal es casi nula, así que no se calculan terciles.</div>').openOn(map);
    return;
  }
  const pct = x => { const p = Math.round(100 * x); return p >= 95 ? '≥ 95 %' : p <= 5 ? '≤ 5 %' : p + ' %'; };
  L.popup({ maxWidth: 240 }).setLatLng(e.latlng).setContent(
    '<div class="pp"><h3>' + D.vars[st.v] + ' · ' + D.periodos[st.p] + '</h3>' +
    '<div class="big">' + fmtU(an) + '</div>' +
    '<div class="row"><span>Bajo lo normal</span><span>' + pct(pb) + '</span></div>' +
    '<div class="row"><span>Normal</span><span>' + pct(pn) + '</span></div>' +
    '<div class="row"><span>Sobre lo normal</span><span>' + pct(pa) + '</span></div>' +
    '<div class="dim">' + lat.toFixed(2) + '°, ' + lng.toFixed(2) + '° · valor interpolado de la grilla de 1°</div></div>'
  ).openOn(map);
});
document.getElementById('opac').addEventListener('input', ev => { st.op = +ev.target.value; if (overlay) overlay.setOpacity(st.op); });
document.getElementById('credit').textContent = 'Corrido el ' + D.fecha + ' por ' + D.autor;
const nSis = D.sistemas ? Math.max(...Object.values(D.sistemas).map(x => x.length)) : 0;
document.getElementById('metaTxt').innerHTML = 'Multi-modelo Copernicus C3S' + (nSis ? ' (' + nSis + ' sistemas)' : '') + ' · inicialización ' + D.init + ' · ' + D.modo +
  ' · grilla de 1° (~110 km) interpolada para visualizar · límites: ' + D.limites;
render();
